<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>爬虫控制台</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Crawler Console</p>
          <h1>爬虫控制台</h1>
          <p class="subtitle">输入链接，选择小说或视频任务，完成后由浏览器下载结果文件。</p>
        </div>
        <div class="status-pill">
          <span></span>
          本地服务运行中
        </div>
      </section>

      <section class="workspace">
        <div class="tabs" role="tablist" aria-label="爬虫类型">
          <button class="tab is-active" type="button" data-tab="novel">小说爬取</button>
          <button class="tab" type="button" data-tab="movie">影视搜索</button>
          <button class="tab" type="button" data-tab="video">视频爬取</button>
          <button class="tab" type="button" data-tab="sales">销量分析</button>
        </div>

        <form class="panel is-active" id="novelForm" data-panel="novel">
          <label class="field field-full">
            <span>小说目录页或章节页链接</span>
            <input name="url" type="url" placeholder="https://example.com/book/123/" required />
          </label>

          <div class="grid">
            <label class="field">
              <span>章节链接选择器</span>
              <input name="chapterLinkSelector" placeholder="#list a，可留空自动识别" />
            </label>
            <label class="field">
              <span>正文选择器</span>
              <input name="contentSelector" placeholder="#content，可留空自动识别" />
            </label>
            <label class="field">
              <span>标题选择器</span>
              <input name="titleSelector" placeholder="h1" />
            </label>
            <label class="field">
              <span>导出文件名</span>
              <input name="out" placeholder="我的小说.txt" />
            </label>
            <label class="field">
              <span>开始章节</span>
              <input name="start" type="number" min="1" value="1" />
            </label>
            <label class="field">
              <span>章节数量</span>
              <input name="limit" type="number" min="0" value="0" />
            </label>
            <label class="field">
              <span>请求间隔(ms)</span>
              <input name="delay" type="number" min="0" value="600" />
            </label>
            <label class="toggle">
              <input name="single" type="checkbox" />
              <span>单章模式</span>
            </label>
          </div>

          <button class="primary" type="submit">开始爬取小说</button>
        </form>

        <form class="panel" id="movieForm" data-panel="movie">
          <label class="field field-full">
            <span>输入想看的电影、电视剧、动漫名称</span>
            <input name="keyword" placeholder="例如：仙剑奇侠传" required />
          </label>
          <button class="primary" type="submit">搜索公开资源</button>
        </form>

        <form class="panel" id="videoForm" data-panel="video">
          <label class="field field-full">
            <span>视频网页链接</span>
            <input name="url" type="url" placeholder="https://example.com/video-page" required />
          </label>
          <button class="primary" type="submit">识别视频资源</button>
          <div class="resource-box" id="videoResources" hidden>
            <div class="resource-title">选择要下载的视频资源</div>
            <div class="resource-list" id="videoResourceList"></div>
            <button class="primary" id="downloadVideo" type="button">下载选中视频</button>
          </div>
        </form>

        <form class="panel" id="salesForm" data-panel="sales">
          <div class="auth-actions">
            <button class="ghost" id="loginTaobao" type="button">登录淘宝</button>
            <button class="ghost" id="loginJd" type="button">登录京东</button>
          </div>
          <div class="grid">
            <label class="field">
              <span>商品类别</span>
              <input name="keyword" placeholder="例如：无线耳机、露营灯、儿童书包" required />
            </label>
            <label class="field">
              <span>榜单数量</span>
              <input name="limit" type="number" min="5" max="50" value="20" />
            </label>
          </div>
          <button class="primary" type="submit">开始分析销量</button>
        </form>
      </section>

      <section class="sales-output" id="salesOutput" hidden>
        <div class="result-header">
          <div>
            <p class="eyebrow">Sales Ranking</p>
            <h2>销量榜单</h2>
          </div>
          <div class="sales-meta" id="salesMeta"></div>
        </div>
        <div class="chart" id="salesChart"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>排名</th>
                <th>平台</th>
                <th>商品</th>
                <th>价格</th>
                <th>销量/热度</th>
                <th>店铺</th>
              </tr>
            </thead>
            <tbody id="salesTable"></tbody>
          </table>
        </div>
      </section>

      <section class="movie-output" id="movieOutput" hidden>
        <div class="result-header">
          <div>
            <p class="eyebrow">Search Results</p>
            <h2>资源列表</h2>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>资源名称</th>
                <th>类型/状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="movieTable"></tbody>
          </table>
        </div>
      </section>

      <section class="result">
        <div class="result-header">
          <div>
            <p class="eyebrow">Task Output</p>
            <h2>任务结果</h2>
          </div>
          <button id="clearLog" class="ghost" type="button">清空</button>
        </div>
        <div id="message" class="message">等待任务提交。</div>
        <pre id="log" class="log"></pre>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
